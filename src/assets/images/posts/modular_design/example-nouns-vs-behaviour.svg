<svg viewBox="0 0 900 415" class="decomposition-compare" width="900" height="415" role="img" aria-labelledby="dc-title dc-desc" xmlns="http://www.w3.org/2000/svg">
<title id="dc-title">Decomposition by nouns compared with decomposition by behaviour</title>
<desc id="dc-desc">On the left, six functions all read and write one shared Event table with ten fields, and every one of them depends on the status field. On the right, three isolated modules, Submissions, Publishing and Slugs, each keep their own data. The web layer calls each module through its interface. The only call between modules is Submissions handing an accepted event to Publishing.</desc>
