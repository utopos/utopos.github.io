.decomposition-compare .dc-heading { font-size: 15px; font-weight: 700; }
.decomposition-compare .dc-title { font-size: 15px; font-weight: 700; }
.decomposition-compare .dc-code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
.decomposition-compare .dc-muted { fill: #575e69; }
.decomposition-compare .dc-label { font-size: 12px; font-weight: 600; }
.decomposition-compare .dc-fn { fill: #f3f3f3; stroke: #575e69; stroke-width: 1.5; }
.decomposition-compare .dc-table { fill: #e4e4e4; stroke: #0e1117; stroke-width: 2; }
.decomposition-compare .dc-module { fill: #fdff6b; stroke: #0e1117; stroke-width: 2; }
.decomposition-compare .dc-local { fill: #f3f3f3; stroke: #0e1117; stroke-width: 1; }
.decomposition-compare .dc-link { stroke: #0e1117; stroke-width: 1.5; fill: none; }
.decomposition-compare .dc-divider { stroke: #d9d9d9; stroke-width: 2; stroke-dasharray: 6 6; }
.decomposition-compare .dc-web { fill: #e4e4e4; stroke: #575e69; stroke-width: 1.5; stroke-dasharray: 6 4; }
.decomposition-compare .dc-rule { stroke: #0e1117; stroke-width: 1; }
.decomposition-compare .dc-head { fill: #0e1117; }
</style>
