<svg viewBox="0 0 800 370" class="cx" width="800" height="370" role="img" aria-labelledby="cx-title cx-desc" xmlns="http://www.w3.org/2000/svg">
<title id="cx-title">Complexity over time</title>
<desc id="cx-desc">A conceptual chart of complexity against time. Essential complexity grows steadily as the system grows. Total complexity curves upwards above it, and the widening gap between the two is accidental complexity.</desc>
<style>
.cx text { font-family: Figtree, system-ui, sans-serif; fill: #0e1117; }
.cx .bg { fill: #f3f3f3; }
.cx .axis { stroke: #575e69; stroke-width: 1.5; fill: none; }
.cx .axis-label { font-size: 13px; fill: #575e69; }
.cx .ess { fill: #d9d9d9; }
.cx .ess-edge { stroke: #575e69; stroke-width: 1.5; fill: none; }
.cx .nouns { stroke: #c2410c; stroke-width: 2.5; fill: none; stroke-linecap: round; }
.cx .lbl { font-size: 13px; font-weight: 600; }
.cx .lbl-muted { font-size: 13px; fill: #575e69; }
.cx .ann { stroke: #0e1117; stroke-width: 1.2; fill: none; }
.cx .head { fill: #0e1117; }
</style>
