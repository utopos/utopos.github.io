<svg viewBox="0 0 900 390" class="boundary-test" width="900" height="390" role="img" aria-labelledby="bt-title bt-desc" xmlns="http://www.w3.org/2000/svg">
<title id="bt-title">A well-shaped struct at the module boundary makes the module easy to test in isolation</title>
<desc id="bt-desc">In production, the web layer receives raw params with string keys and string values, normalises them into a Publishing.Event struct with typed fields, and calls Publishing.publish with it. Publishing shows only its interface and hides its table, queries and rules. A test builds the same struct directly and calls the same interface. The dashed test boundary encloses the struct, the test and the Publishing module, but not the web layer, so the test needs neither the web layer nor any other module.</desc>
<style>
.boundary-test text { font-family: Figtree, system-ui, sans-serif; fill: #0e1117; }
.boundary-test .bt-title { font-size: 17px; font-weight: 700; }
.boundary-test .bt-mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #0e1117; }
.boundary-test .bt-mono-sm { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #0e1117; }
.boundary-test .bt-mono-bold { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; fill: #0e1117; }
.boundary-test .bt-sub { font-size: 12px; fill: #575e69; }
.boundary-test .bt-label { font-size: 12px; font-weight: 600; }
.boundary-test .bt-caps { font-size: 11px; font-weight: 600; fill: #575e69; letter-spacing: 0.5px; }
.boundary-test .bt-iface-text { font-size: 11px; font-weight: 600; fill: #f3f3f3; letter-spacing: 1px; }
.boundary-test .bt-web { fill: #e4e4e4; stroke: #575e69; stroke-width: 1.5; stroke-dasharray: 6 4; }
.boundary-test .bt-card { fill: #ffffff; stroke: #0e1117; stroke-width: 2; }
.boundary-test .bt-module { fill: #fdff6b; stroke: #0e1117; stroke-width: 2; }
.boundary-test .bt-iface { fill: #0e1117; }
.boundary-test .bt-secret { fill: #f3f3f3; stroke: #575e69; stroke-width: 1.5; stroke-dasharray: 6 4; }
.boundary-test .bt-item { fill: #ffffff; stroke: #0e1117; stroke-width: 1; }
.boundary-test .bt-boundary { fill: none; stroke: #d6336c; stroke-width: 2; stroke-dasharray: 8 5; }
.boundary-test .bt-boundary-text { font-size: 12px; font-weight: 700; fill: #d6336c; }
.boundary-test .bt-arrow { stroke: #0e1117; stroke-width: 1.5; fill: none; }
.boundary-test .bt-head { fill: #0e1117; }
</style>
<defs>
<marker id="bt-arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="bt-head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>

<!-- test boundary -->
<rect class="bt-boundary" x="285" y="15" width="605" height="335" rx="12"/>
<text class="bt-boundary-text" x="300" y="372">Test boundary: no web layer, no other modules</text>

<!-- web layer with raw params -->
<rect class="bt-web" x="10" y="45" width="200" height="120" rx="8"/>
<text class="bt-title" x="110" y="72" text-anchor="middle">Web layer</text>
<text class="bt-caps" x="22" y="96">RAW PARAMS</text>
<text class="bt-mono-sm" x="22" y="116">%{"title" =&gt; "Meetup",</text>
<text class="bt-mono-sm" x="30" y="134">"start" =&gt; "2026-10-26",</text>
<text class="bt-mono-sm" x="30" y="152">"duration" =&gt; "90"}</text>

<line class="bt-arrow" x1="210" y1="105" x2="303" y2="105" marker-end="url(#bt-arrowhead)"/>
<text class="bt-label" x="247" y="97" text-anchor="middle">normalise</text>

<!-- well-shaped struct -->
<rect class="bt-card" x="305" y="45" width="215" height="120" rx="8"/>
<text class="bt-caps" x="320" y="68">WELL-SHAPED INPUT</text>
<text class="bt-mono-bold" x="320" y="90">%Publishing.Event{</text>
<text class="bt-mono" x="335" y="110">title: "Meetup",</text>
<text class="bt-mono" x="335" y="128">start: ~U[2026-10-26 …],</text>
<text class="bt-mono" x="335" y="146">duration_minutes: 90}</text>

<line class="bt-arrow" x1="520" y1="105" x2="623" y2="105" marker-end="url(#bt-arrowhead)"/>
<text class="bt-label" x="571" y="97" text-anchor="middle">publish/1</text>

<!-- test -->
<rect class="bt-card" x="305" y="240" width="215" height="80" rx="8"/>
<text class="bt-title" x="412" y="272" text-anchor="middle">PublishingTest</text>
<text class="bt-sub" x="412" y="296" text-anchor="middle">builds the struct directly</text>

<line class="bt-arrow" x1="520" y1="280" x2="623" y2="280" marker-end="url(#bt-arrowhead)"/>
<text class="bt-label" x="571" y="272" text-anchor="middle">publish/1</text>

<!-- Publishing module -->
<rect class="bt-module" x="625" y="35" width="250" height="300" rx="8"/>
<rect class="bt-iface" x="625" y="35" width="26" height="300" rx="0"/>
<text class="bt-iface-text" x="642" y="185" text-anchor="middle" transform="rotate(-90 642 185)">INTERFACE</text>
<text class="bt-title" x="763" y="68" text-anchor="middle">Publishing</text>
<text class="bt-mono" x="763" y="92" text-anchor="middle">publish/1 · cancel/1</text>
<text class="bt-mono" x="763" y="110" text-anchor="middle">fetch_by_id/1 · search/1</text>
<rect class="bt-secret" x="672" y="150" width="185" height="165" rx="8"/>
<text class="bt-caps" x="764" y="174" text-anchor="middle">HIDDEN</text>
<rect class="bt-item" x="690" y="188" width="150" height="32" rx="6"/>
<text x="765" y="209" text-anchor="middle">events table</text>
<rect class="bt-item" x="690" y="228" width="150" height="32" rx="6"/>
<text x="765" y="249" text-anchor="middle">queries</text>
<rect class="bt-item" x="690" y="268" width="150" height="32" rx="6"/>
<text x="765" y="289" text-anchor="middle">cancel rules</text>
</svg>
