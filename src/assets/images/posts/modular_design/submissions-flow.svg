<svg viewBox="0 0 800 520" class="slug-seq" width="800" height="520" role="img" aria-labelledby="sq-title sq-desc" xmlns="http://www.w3.org/2000/svg">
<title id="sq-title">Submitting and reviewing an event</title>
<desc id="sq-desc">The author submits an event through the web UI, which calls Submissions.submit. Later a reviewer either accepts or rejects it. On accept, the web UI calls Submissions.accept, and Submissions calls Publishing.publish with the event data. On reject, the web UI calls Submissions.reject with a reason, and the event stays in Submissions. A rejected event never reaches Publishing.</desc>
<style>
.slug-seq text { font-family: Figtree, system-ui, sans-serif; fill: #0e1117; }
.slug-seq .bg { fill: #f3f3f3; }
.slug-seq .module { fill: #fdff6b; stroke: #0e1117; stroke-width: 2; }
.slug-seq .actor { fill: #ffffff; stroke: #575e69; stroke-width: 1.5; }
.slug-seq .web { fill: #ffffff; stroke: #575e69; stroke-width: 1.5; stroke-dasharray: 6 4; }
.slug-seq .name { font-size: 15px; font-weight: 700; }
.slug-seq .life { stroke: #575e69; stroke-width: 1.5; stroke-dasharray: 3 5; }
.slug-seq .act { fill: #ffffff; stroke: #0e1117; stroke-width: 1.5; }
.slug-seq .call { stroke: #0e1117; stroke-width: 1.8; fill: none; }
.slug-seq .ret { stroke: #0e1117; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
.slug-seq .code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; }
.slug-seq .code-sm { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; }
.slug-seq .step { font-size: 12px; font-weight: 700; fill: #f3f3f3; }
.slug-seq .step-dot { fill: #0e1117; }
.slug-seq .note { fill: #ffffff; stroke: #0e1117; stroke-width: 1; }
.slug-seq .note-text { font-size: 13px; }
.slug-seq .head { fill: #0e1117; }
.slug-seq .lbl-bg { fill: #f3f3f3; }
.slug-seq .frame { fill: none; stroke: #0e1117; stroke-width: 1.5; }
.slug-seq .frame-tag { fill: #0e1117; }
.slug-seq .frame-tag-text { font-size: 12px; font-weight: 700; fill: #f3f3f3; }
.slug-seq .guard { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; }
.slug-seq .divider { stroke: #0e1117; stroke-width: 1.5; stroke-dasharray: 6 4; }
</style>
<defs>
<marker id="sq-a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="sq-o" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#0e1117" stroke-width="1.5"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="800" height="520"/>
<line class="life" x1="60" y1="64" x2="60" y2="440"/>
<line class="life" x1="185" y1="64" x2="185" y2="440"/>
<line class="life" x1="340" y1="64" x2="340" y2="440"/>
<line class="life" x1="535" y1="64" x2="535" y2="440"/>
<line class="life" x1="720" y1="64" x2="720" y2="440"/>
<rect class="actor" x="5.0" y="20" width="110" height="44" rx="22"/>
<text class="name" x="60" y="47" text-anchor="middle">Author</text>
<rect class="actor" x="130.0" y="20" width="110" height="44" rx="22"/>
<text class="name" x="185" y="47" text-anchor="middle">Reviewer</text>
<rect class="web" x="275.0" y="20" width="130" height="44" rx="10"/>
<text class="name" x="340" y="47" text-anchor="middle">Web UI</text>
<rect class="module" x="470.0" y="20" width="130" height="44" rx="10"/>
<text class="name" x="535" y="47" text-anchor="middle">Submissions</text>
<rect class="module" x="655.0" y="20" width="130" height="44" rx="10"/>
<text class="name" x="720" y="47" text-anchor="middle">Publishing</text>
<line class="call" x1="60" y1="105" x2="340" y2="105" marker-end="url(#sq-a)"/>
<rect class="lbl-bg" x="138" y="83" width="124" height="17"/>
<text class="note-text" x="200.0" y="96" text-anchor="middle">submits the form</text>
<line class="call" x1="340" y1="145" x2="535" y2="145" marker-end="url(#sq-a)"/>
<rect class="lbl-bg" x="358" y="123" width="158" height="17"/>
<text class="code" x="437.5" y="136" text-anchor="middle">submit(event_params)</text>
<rect class="frame" x="130" y="175" width="660" height="245"/>
<path class="frame-tag" d="M130,175 H174 V187 L166,195 H130 Z"/>
<text class="frame-tag-text" x="138" y="190">alt</text>
<text class="guard" x="184" y="191">[accept]</text>
<line class="call" x1="185" y1="225" x2="340" y2="225" marker-end="url(#sq-a)"/>
<rect class="lbl-bg" x="232" y="203" width="61" height="17"/>
<text class="note-text" x="262.5" y="216" text-anchor="middle">accepts</text>
<line class="call" x1="340" y1="260" x2="535" y2="260" marker-end="url(#sq-a)"/>
<rect class="lbl-bg" x="366" y="238" width="143" height="17"/>
<text class="code" x="437.5" y="251" text-anchor="middle">accept(submission)</text>
<line class="call" x1="535" y1="295" x2="720" y2="295" marker-end="url(#sq-a)"/>
<rect class="lbl-bg" x="545" y="273" width="165" height="17"/>
<text class="code" x="627.5" y="286" text-anchor="middle">publish(event)</text>
<line class="divider" x1="130" y1="320" x2="790" y2="320"/>
<text class="guard" x="140" y="338">[reject]</text>
<line class="call" x1="185" y1="365" x2="340" y2="365" marker-end="url(#sq-a)"/>
<rect class="lbl-bg" x="183" y="343" width="159" height="17"/>
<text class="note-text" x="262.5" y="356" text-anchor="middle">rejects with a reason</text>
<line class="call" x1="340" y1="400" x2="535" y2="400" marker-end="url(#sq-a)"/>
<rect class="lbl-bg" x="337" y="378" width="202" height="17"/>
<text class="code" x="437.5" y="391" text-anchor="middle">reject(submission, reason)</text>
<rect class="note" x="420" y="460" width="360" height="40" rx="6"/>
<text class="note-text" x="600" y="485" text-anchor="middle">A rejected event never reaches Publishing.</text>
</svg>
