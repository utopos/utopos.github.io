.generic-compare .gc-small { font-size: 11px; }
.generic-compare .gc-inverse { fill: #f3f3f3; font-size: 11px; font-weight: 600; }
.generic-compare .gc-fn { fill: #f3f3f3; stroke: #575e69; stroke-width: 1.5; }
.generic-compare .gc-table { fill: #e4e4e4; stroke: #0e1117; stroke-width: 2; }
.generic-compare .gc-module { fill: #fdff6b; stroke: #0e1117; stroke-width: 2; }
.generic-compare .gc-iface { fill: #0e1117; }
.generic-compare .gc-local { fill: #f3f3f3; stroke: #0e1117; stroke-width: 1; }
.generic-compare .gc-bar { fill: #575e69; opacity: 0.35; }
.generic-compare .gc-link { stroke: #0e1117; stroke-width: 1.5; fill: none; }
.generic-compare .gc-divider { stroke: #d9d9d9; stroke-width: 2; stroke-dasharray: 6 6; }
.generic-compare .gc-head { fill: #0e1117; }
.generic-compare .gc-shelf { fill: #e4e4e4; stroke: #575e69; stroke-width: 1.5; stroke-dasharray: 6 4; }
.generic-compare .gc-shelf-name { font-size: 11px; font-weight: 600; fill: #575e69; letter-spacing: 0.5px; }
.generic-compare .gc-entity { fill: #ffffff; stroke: #0e1117; stroke-width: 1.5; }
.generic-compare .gc-uses { stroke: #0e1117; stroke-width: 2; fill: none; }
.generic-compare .gc-rel { stroke: #575e69; stroke-width: 2; stroke-dasharray: 2 4; stroke-linecap: round; fill: none; }
</style>
