<svg viewBox="0 0 800 400" class="generic-compare" width="800" height="400" role="img" aria-labelledby="gc-title gc-desc" xmlns="http://www.w3.org/2000/svg">
<title id="gc-title">A shared data model compared with modules that own their data</title>
<desc id="gc-desc">On the left, three contexts each use several of three entities in one shared data model, and the entities are linked to each other by relations, so the lines cross and tangle. On the right, three independent modules each keep their own data behind an interface, with no links between them.</desc>
<style>
.generic-compare text { font-family: Figtree, system-ui, sans-serif; fill: #0e1117; }
.generic-compare .gc-heading { font-size: 15px; font-weight: 700; }
